name: "Run VS Code tests"
description: "Compiles the TypeScript extension and runs the Mocha unit and integration tests inside a VS Code extension host"
runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Compile extension and tests
      run: npm run compile-tests
      shell: bash

    - name: Run tests
      run: xvfb-run --auto-servernum npm run test
      shell: bash
